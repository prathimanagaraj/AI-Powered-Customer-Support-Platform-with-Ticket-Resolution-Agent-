<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SupportPilot - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: #f5f3ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 410px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e7e3f4;
            border-radius: 18px;
            padding: 38px 35px;
            box-shadow: 0 12px 35px rgba(50, 40, 90, 0.10);
        }

        /* LOGO */

        .logo-area {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 48px;
            height: 48px;
            margin: auto;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
        }

        .logo-area h1 {
            margin: 13px 0 5px;
            color: #312e81;
            font-size: 23px;
            font-weight: 800;
        }

        .logo-area p {
            margin: 0;
            color: #8a91a2;
            font-size: 11px;
        }

        /* TITLE */

        .login-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-title h2 {
            margin: 0;
            color: #30304d;
            font-size: 18px;
            font-weight: 700;
        }

        .login-title p {
            margin-top: 6px;
            color: #8a91a2;
            font-size: 11px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #454b5b;
            font-size: 11px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #ddd8eb;
            border-radius: 9px;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            transition: .2s;
        }

        .form-control:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.10);
        }

        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;
            border: none;
            background: #7c3aed;
            color: white;
            padding: 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .login-btn:hover {
            background: #6d28d9;
        }

        /* ERROR */

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 17px;
            text-align: center;
            font-size: 10px;
        }

        /* FOOTER */

        .login-footer {
            text-align: center;
            margin-top: 22px;
            color: #9aa2b1;
            font-size: 9px;
        }

        .ai-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 11px;
            border-radius: 20px;
            background: #ede9fe;
            color: #6d28d9;
            font-size: 9px;
            font-weight: 700;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- LOGO -->

        <div class="logo-area">

            <div class="logo">
                SP
            </div>

            <h1>SupportPilot</h1>

        </div>


        <!-- LOGIN TITLE -->

        <div class="login-title">

            <h2>Welcome Back</h2>

            <p>Sign in to access the SupportPilot dashboard</p>

        </div>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form action="/login" method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>


        <div class="login-footer">

            SupportPilot • Intelligent IT Support Management

        </div>

    </div>

</div>

</body>

</html>
